packages:
  - artifacts/*
  - scripts

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.2.3
  react-dom: 19.2.3
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - expo
  - expo-*
  - '@expo/*'
  - babel-preset-expo
  - metro
  - metro-*
  - '@react-native/*'
  - react-native
  - react-native-*
  - react
  - react-dom

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # Pin Expo to SDK 56 so a --no-frozen-lockfile re-resolve (e.g. on EAS) can't
  # drift to expo@57 (SDK 57 = `latest`), whose @expo/fingerprint@^0.20.6 trips
  # the minimumReleaseAge gate. Only sgs-minfinder uses expo in this workspace.
  expo: 56.0.16
  '@expo/fingerprint': 0.19.8
  # Pin RN to the SDK-56 version so a --no-frozen re-resolve can't drift to
  # 0.86 (which removed Libraries/Renderer/shims/ReactNative that SDK-56's
  # react-native-gesture-handler@2.31.2 still imports).
  react-native: 0.85.3
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  esbuild: 0.27.3
