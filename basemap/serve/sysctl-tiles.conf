# sysctl-tiles.conf — kernel network tuning for the MinFinder tile server.
#
# Install (as root):
#   install -m 644 sysctl-tiles.conf /etc/sysctl.d/60-tiles.conf
#   sysctl -p /etc/sysctl.d/60-tiles.conf      # apply now; prints each value
#   sysctl net.core.somaxconn net.ipv4.ip_local_port_range   # confirm it took
#
# Why this file exists. A maximum-size offline pack is ~57,000 requests in one
# burst (see lib/tileCache.ts), and every one of them takes TWO hops on this
# box: client -> Caddy (:443), then Caddy -> go-pmtiles over loopback (:8081).
# Nothing in the stock Ubuntu defaults is sized for that many short-lived
# connections arriving at once, and the failure is not a slow server but
# silent connection drops (SYN backlog overflow) or Caddy failing to open a
# loopback connection because every ephemeral port is parked in TIME_WAIT.
# The keepalive settings in Caddyfile.example are the primary fix for the
# loopback hop; these are the belt to that braces. CPU, RAM and disk are not
# a concern on this box (8 vCores / 24 GB, archives in page cache) — only the
# network path needs tuning.
#
# Check after a real region download with:   ss -s      (look at timewait)
#                                            ss -ltn    (Recv-Q vs Send-Q on :443/:8081)

# Accept queue depth for listening sockets. Go's net.Listen (both Caddy and
# go-pmtiles) asks for a backlog of somaxconn, so this is the cap on how many
# completed-but-not-yet-accepted connections can wait. Default 4096 on 5.4+
# kernels, 128 on older ones; set explicitly so it is the same everywhere.
net.core.somaxconn = 4096

# Half-open (SYN received, ACK not yet) queue. A burst of a few thousand new
# TLS connections from one app instance behind a slow LTE link keeps many
# handshakes in flight simultaneously; when this overflows the kernel drops
# SYNs and the client sees connection timeouts, which the app reads as a
# network error. Default 128–1024 depending on memory.
net.ipv4.tcp_max_syn_backlog = 8192

# Ephemeral source ports for the Caddy -> go-pmtiles loopback hop. The default
# range 32768–60999 is ~28,000 ports; without upstream keepalive a 57k-request
# burst would exhaust it in well under the 60 s TIME_WAIT hold and Caddy would
# start returning 502s to the client mid-download. Widened to ~55,000. The
# lower bound stays above every listener on this box (8080 website API,
# 8081 go-pmtiles, 8082 the optional nginx sidecar) so an outgoing connection
# can never race one of them for a port.
net.ipv4.ip_local_port_range = 10240 65535

# Let the kernel reuse a TIME_WAIT socket for a new outgoing connection when
# safe (timestamps make this correct). Kernels ≥ 4.19 default to 2 = loopback
# only, which already covers the hop that matters here; 1 extends it to all
# outgoing connections, of which this box makes very few, so it is harmless
# and removes the dependency on the kernel default.
net.ipv4.tcp_tw_reuse = 1
